; ESP32-C3 Super Mini + 1.28" round GC9A01 (240×240)
; Board in Arduino IDE: "ESP32C3 Dev Module" or "MakerGO ESP32 C3 SuperMini"

[platformio]
default_envs = supermini

[env:supermini]
platform = espressif32@6.5.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions/plane_radar.csv
extra_scripts = post:scripts/merge_firmware.py

; Anti-aliased VLW font (Noto Sans Bold 15, from TFT_eSPI smooth-font examples)
; Mozilla CA bundle for TLS verification (scripts/update_ca_bundle.sh)
board_build.embed_files =
  data/ui_font.vlw
  data/x509_crt_bundle.bin

; USB serial over USB-C (Super Mini native USB)
build_flags =
  -std=gnu++17
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWM_NODEBUG
  -DWM_MDNS

lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  tzapu/WiFiManager@^2.0.17
  bblanchon/ArduinoJson@^7.4.2

; Host-side unit tests for lib/ (macOS / Linux): pio test -e native
[env:native]
platform = native
test_framework = googletest
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -O0
  --coverage
extra_scripts = post:scripts/native_coverage.py
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
